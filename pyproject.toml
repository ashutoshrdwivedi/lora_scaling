[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-serving"
version = "0.1.0"
description = "Multi-tenant LoRA serving for encoder models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.39,<5.0",
    "accelerate>=0.26",
    "numpy>=1.26",
    "pydantic>=2.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]
quality = [
    "setfit>=1.1.0",
    "datasets>=2.14",
    "scikit-learn>=1.3",
    "typer>=0.12",
]
paper = [
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "peft>=0.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
