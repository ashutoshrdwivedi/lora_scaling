[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-serving"
version = "0.1.0"
description = "Multi-tenant LoRA serving for encoder models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.39",
    "accelerate>=0.26",
    "numpy>=1.26",
    "pydantic>=2.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
